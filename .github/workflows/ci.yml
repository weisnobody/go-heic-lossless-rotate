# Runs on the GitHub mirror (primary repo: arena.the42.net). See docs/DESIGN.md.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  # release.yml runs this before publishing a tag
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.23", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: go vet
        run: |
          go vet ./...
          go vet -tags difftest ./...
      - name: staticcheck
        if: matrix.go == 'stable'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
          staticcheck -tags difftest ./...
      - name: go test
        run: go test -race ./...

  difftest:
    name: difftest (vs pinned Python upstream)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read upstream pin
        id: pin
        run: echo "commit=$(cat difftest/upstream.commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: olegoz/heic-lossless-rotate
          ref: ${{ steps.pin.outputs.commit }}
          path: .upstream
          # full history so `git rev-parse HEAD` resolves to the pinned SHA
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: make difftest
        run: make difftest
